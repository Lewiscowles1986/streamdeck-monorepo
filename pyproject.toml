[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamdeck"
version = "0.1.0"
description = "Standalone Stream Deck control stack: device runner, config API and web UI in one command"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Lewis Cowles" }]
keywords = ["elgato", "streamdeck", "stream-deck", "hid"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlmodel>=0.0.16",
  "alembic>=1.13",
  "pillow>=10.0",
  "requests>=2.32",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "playwright>=1.48",
  "pytest-playwright>=0.6",
]
e2e = [
  "pytest>=8.0",
  "pytest-playwright>=0.6",
]

[project.scripts]
streamdeck = "streamdeck.cli:app"

[project.urls]
Homepage = "https://github.com/Lewiscowles1986/streamdeck-monorepo"
UpstreamLibrary = "https://github.com/abcminiuser/python-elgato-streamdeck"

[tool.hatch.build.targets.wheel]
packages = ["streamdeck"]

[tool.pytest.ini_options]
testpaths = ["tests", "e2e"]
addopts = "-m 'not hardware'"
markers = [
  "hardware: tests that require a physical Stream Deck attached (deselected by default)",
]

[tool.ruff]
line-length = 120