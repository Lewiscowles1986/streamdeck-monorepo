name: CI

on:
  push:
    branches: [main]
  pull_request:

# ONE tool owns the environment: astral-sh/setup-uv installs the Python and
# creates `.venv`; every step then addresses that venv by path.
#
# The previous shape split ownership (actions/setup-python supplied the
# interpreter, setup-uv was told to supply uv only, install was redirected
# with UV_SYSTEM_PYTHON) and broke on the seams three runs in a row. Calling
# `uv venv` by hand also collided with the venv setup-uv already makes.
# Neither of those is possible in the shape below: there is exactly one
# interpreter, one venv, and no ambient-Python invocation anywhere.
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache-dependency-glob: pyproject.toml
      - name: Install into .venv (the venv setup-uv just created)
        run: uv pip install --python .venv/bin/python -e '.[dev]'
      - name: Integration tests (dummy transport, no hardware)
        # JUnit XML -> ::error annotations (inline on the file + Checks tab)
        # and a Markdown job summary, so a failure is readable without going
        # into the log — which on a private repo needs a GitHub sign-in. The
        # reporting script always exits 0; pytest's own status is what this
        # step returns, so a failure stays a failure.
        run: |
          set +e
          .venv/bin/python -m pytest tests -q -m 'not hardware' \
            --junit-xml=/tmp/junit.xml -rf > /tmp/pytest.log 2>&1
          ret=$?
          tail -n 25 /tmp/pytest.log
          .venv/bin/python scripts/pytest-summary.py /tmp/junit.xml \
            --pytest-log /tmp/pytest.log
          exit "$ret"
      - name: uvx smoke (single command usability)
        run: |
          uvx --from . streamdeck --help
          uvx --from . streamdeck version
          STREAMDECK_TRANSPORT=dummy uvx --from . streamdeck list-devices

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - name: Build demo + full bundles
        run: |
          VITE_DEMO_MODE=1 bun run build
          rm -rf dist-demo && mv dist dist-demo
          bun run build

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, python]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # Same single owner: setup-uv makes the Python AND the .venv that
      # playwright.config.ts webServers expect at ${ROOT}/.venv/bin/python.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache-dependency-glob: pyproject.toml
      - name: Install root dev deps (@playwright/test)
        run: bun install
        working-directory: .
      - name: Install frontend deps
        run: bun install
        working-directory: frontend
      - name: Install Python package (dev extras)
        run: uv pip install --python .venv/bin/python -e '.[dev]'
      - name: Build both frontend bundles
        run: bash scripts/build-frontend.sh
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run E2E (demo-ui + full-stack with dummy device)
        # Playwright's built-in `github` reporter emits ::error annotations
        # with file/line for each failed spec. `html` gives the browsable
        # report that the artifact upload below already expects.
        run: bunx playwright test --reporter=github,html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          # test-results holds traces/screenshots; playwright-report is the
          # browsable HTML report produced by the `html` reporter above.
          path: |
            test-results/
            playwright-report/
          retention-days: 7
