name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv pip install --system -e '.[dev]'
      - name: Integration tests (dummy transport, no hardware)
        run: python -m pytest tests -q -m 'not hardware'
      - name: uvx smoke (single command usability)
        run: |
          uvx --from . streamdeck --help
          uvx --from . streamdeck version
          STREAMDECK_TRANSPORT=dummy uvx --from . streamdeck list-devices

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - name: Build demo + full bundles
        run: |
          VITE_DEMO_MODE=1 bun run build
          rm -rf dist-demo && mv dist dist-demo
          bun run build

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, python-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install Python package (dev extras)
        run: uv pip install --system -e '.[dev]'
      - name: Build both frontend bundles
        run: ./scripts/build-frontend.sh
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run E2E (demo-ui + full-stack with dummy device)
        run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
