name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: pyproject.toml
          cache-suffix: "${{ matrix.os }}-${{ matrix.python }}"
      - name: Install
        run: uv pip install -e '.[dev]'
        env:
          # Env-var form of --system: install into the setup-python
          # interpreter (toolcache Pythons carry no EXTERNALLY-MANAGED
          # marker, unlike uv-managed or distro Pythons).
          UV_SYSTEM_PYTHON: "true"
      - name: Integration tests (dummy transport, no hardware)
        run: python -m pytest tests -q -m 'not hardware'
      - name: uvx smoke (single command usability)
        run: |
          uvx --from . streamdeck --help
          uvx --from . streamdeck version
          STREAMDECK_TRANSPORT=dummy uvx --from . streamdeck list-devices

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - name: Build demo + full bundles
        run: |
          VITE_DEMO_MODE=1 bun run build
          rm -rf dist-demo && mv dist dist-demo
          bun run build

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, python-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: pyproject.toml
          cache-suffix: e2e
      - name: Install root dev deps (@playwright/test)
        run: bun install
        working-directory: .
      - name: Install frontend deps
        run: bun install
        working-directory: frontend
      # The only venv in this workflow: playwright.config.ts webServers
      # hardcode ${ROOT}/.venv/bin/python. Built with the stdlib from the
      # setup-python interpreter — no uv-managed Python involved.
      - name: Create venv (playwright.config.ts expects .venv)
        run: python -m venv .venv
      - name: Install Python package (dev extras)
        run: uv pip install --python .venv/bin/python -e '.[dev]'
      - name: Build both frontend bundles
        run: bash scripts/build-frontend.sh
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run E2E (demo-ui + full-stack with dummy device)
        run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
